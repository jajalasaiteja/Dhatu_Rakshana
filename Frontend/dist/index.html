    <meta name="description" content="Dhatu Rakshana is a marine coating inspection and defect analysis platform designed to evaluate surface condition through image-based inspection, defect characterization, three-dimensional topography reconstruction, and standards-based assessment." />
    <!-- Technical Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Initialize Theme before paint to prevent flashing -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dhatu_theme');
          if (saved === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
