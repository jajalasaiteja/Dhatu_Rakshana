services:
  postgres:
    image: postgres:16-alpine
    container_name: dhatu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: marine_defect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marine_defect_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dhatu_backend_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/marine_defect_db
      APP_ENV: production
      DEBUG: "False"
      STORAGE_DIR: /app/storage
      MODELS_DIR: /app/models
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - inspection_storage:/app/storage
      - ../models:/app/models:ro
      - ../Frontend/dist:/app/Frontend/dist:ro
    networks:
      - backend_network

volumes:
  postgres_data:
  inspection_storage:

networks:
  backend_network:
    driver: bridge
