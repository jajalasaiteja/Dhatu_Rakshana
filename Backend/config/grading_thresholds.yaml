standards:
  SSPC_PA2:
    name: "SSPC-PA 2 / NACE SP0188"
    description: "Measurement of Dry Coating Thickness and Discontinuity (Holiday) Testing on Steel Structures"
  ISO_4628:
    name: "ISO 4628-4 / SSPC-VIS 2"
    description: "Evaluation of degradation of coatings - Assessment of degree of cracking, rusting, and flaking"
  ISO_8501:
    name: "ISO 8501-1"
    description: "Preparation of steel substrates before application of paints - Surface cleanliness grades"
  ISO_8502:
    name: "ISO 8502-3"
    description: "Assessment of dust on steel surfaces prepared for painting (pressure-sensitive tape method)"
  AMPP_QP:
    name: "AMPP QP / Marine Qualification"
    description: "Standard procedure for qualification of naval coating contractor and inspection evaluation"

rules:
  # Discontinuities, Pinholes & Holidays (High galvanic corrosion risk)
  pinhole:
    standard_reference: "SSPC-PA 2 / NACE SP0188 Discontinuity Standard"
    rule_version: "2.1.0"
    thresholds:
      - max_area_pct: 0.5
        min_confidence: 0.50
        severity: "Low"
        pass_fail: "PASS"
      - max_area_pct: 2.0
        min_confidence: 0.50
        severity: "Medium"
        pass_fail: "REVIEW"
      - max_area_pct: 100.0
        min_confidence: 0.50
        severity: "High"
        pass_fail: "FAIL"

  # Scratches, Mechanical Gouges & Crevice Discontinuities
  scratch:
    standard_reference: "ISO 4628-4 Coating Mechanical Integrity"
    rule_version: "2.1.0"
    thresholds:
      - max_area_pct: 1.0
        min_confidence: 0.50
        severity: "Low"
        pass_fail: "PASS"
      - max_area_pct: 4.0
        min_confidence: 0.50
        severity: "Medium"
        pass_fail: "REVIEW"
      - max_area_pct: 100.0
        min_confidence: 0.50
        severity: "Critical"
        pass_fail: "FAIL"

  # Chemical, Grease, or Salt Contamination / Active Rust Bloom
  contamination:
    standard_reference: "ISO 8501-1 Surface Preparation & Contamination Grade"
    rule_version: "2.1.0"
    thresholds:
      - max_area_pct: 1.5
        min_confidence: 0.50
        severity: "Low"
        pass_fail: "PASS"
      - max_area_pct: 5.0
        min_confidence: 0.50
        severity: "Medium"
        pass_fail: "REVIEW"
      - max_area_pct: 100.0
        min_confidence: 0.50
        severity: "Critical"
        pass_fail: "FAIL"

  # Corrosion / Oxidation / Rust Scale
  corrosion:
    standard_reference: "ISO 4628-3 Rusting Degree Assessment / SSPC-VIS 2"
    rule_version: "2.1.0"
    thresholds:
      - max_area_pct: 0.5
        min_confidence: 0.50
        severity: "Low"
        pass_fail: "PASS"
      - max_area_pct: 3.0
        min_confidence: 0.50
        severity: "Medium"
        pass_fail: "REVIEW"
      - max_area_pct: 100.0
        min_confidence: 0.50
        severity: "Critical"
        pass_fail: "FAIL"

  # Blistering / Delamination / Osmotic Pockets
  blister:
    standard_reference: "ISO 4628-2 Assessment of Degree of Blistering"
    rule_version: "2.1.0"
    thresholds:
      - max_area_pct: 0.8
        min_confidence: 0.50
        severity: "Low"
        pass_fail: "PASS"
      - max_area_pct: 3.5
        min_confidence: 0.50
        severity: "Medium"
        pass_fail: "REVIEW"
      - max_area_pct: 100.0
        min_confidence: 0.50
        severity: "High"
        pass_fail: "FAIL"

  # Embedded Inclusions (slag, blasting grit)
  inclusion:
    standard_reference: "ISO 8501-1 / SSPC-SP 10 Marine Grade"
    rule_version: "2.1.0"
    thresholds:
      - max_area_pct: 1.5
        min_confidence: 0.50
        severity: "Low"
        pass_fail: "PASS"
      - max_area_pct: 4.5
        min_confidence: 0.50
        severity: "Medium"
        pass_fail: "REVIEW"
      - max_area_pct: 100.0
        min_confidence: 0.50
        severity: "High"
        pass_fail: "FAIL"

  # Dust & Blast Particles (Class 1)
  dust_particle:
    standard_reference: "ISO 8502-3 Dust Particle Rating"
    rule_version: "2.1.0"
    thresholds:
      - max_area_pct: 0.8
        min_confidence: 0.60
        severity: "Negligible"
        pass_fail: "PASS"
      - max_area_pct: 100.0
        min_confidence: 0.60
        severity: "Medium"
        pass_fail: "REVIEW"

default_rule:
  standard_reference: "AMPP QP / Marine General Assessment"
  rule_version: "2.1.0"
  severity: "Medium"
  pass_fail: "REVIEW"
