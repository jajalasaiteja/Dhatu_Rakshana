services:
  db:
    image: postgres:16-alpine
    container_name: dhatu_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marine_defect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marine_defect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dhatu_backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/marine_defect_db
      - STORAGE_DIR=/app/backend/storage
      - GRADING_CONFIG_PATH=/app/backend/config/grading_thresholds.yaml
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/backend/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhatu_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
